
name: DevOps - PetVille API

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilar API
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore PetVille.API/PetVille.API.csproj

      - name: Compilar API
        run: dotnet build ./PetVille.API/PetVille.API.csproj --no-restore --configuration Release

      - name: Executar testes automatizados
        run: dotnet test ./PetVille.Tests/PetVille.Tests.csproj --configuration Release
